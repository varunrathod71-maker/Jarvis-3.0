
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract JARVIS source ZIP
        shell: bash
        run: |
          set -e
          echo "Checking for the JARVIS project ZIP..."
          ls -la
          test -f "JARVIS_Diagnostic_Build_Updated.zip"

          mkdir -p extracted
          unzip -oq JARVIS_Diagnostic_Build_Updated.zip -d extracted

          PROJECT_DIR="extracted/JARVIS_Phone_Control_Starter"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "JARVIS source files found!"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build JARVIS APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" assembleDebug \
            2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: extracted/JARVIS_Phone_Control_Starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-build-error-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
          
